<!DOCTYPE html>
<html>
<head>
    <title>Login – AIKONIK</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sora', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a1628;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated background ── */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 20% 20%, #0d3d2e 0%, transparent 55%),
                        radial-gradient(ellipse at 80% 80%, #0a1f3d 0%, transparent 55%),
                        radial-gradient(ellipse at 60% 10%, #1a1040 0%, transparent 45%),
                        #080f1e;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: drift 12s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(26,188,156,0.55) 0%, transparent 70%);
            top: -120px; left: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(99,102,241,0.45) 0%, transparent 70%);
            bottom: -80px; right: -60px;
            animation-delay: -4s;
        }
        .orb-3 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(6,182,212,0.35) 0%, transparent 70%);
            top: 50%; left: 65%;
            animation-delay: -8s;
        }
        .orb-4 {
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(168,85,247,0.3) 0%, transparent 70%);
            top: 20%; right: 15%;
            animation-delay: -2s;
        }

        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 20px) scale(1.08); }
        }

        /* ── Grid overlay ── */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ── Card ── */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.055);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 36px 36px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 20px 60px rgba(0,0,0,0.5),
                0 4px 16px rgba(26,188,156,0.08);
        }

        /* top shimmer line */
        .glass-card::before {
            content: '';
            display: block;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            margin: -40px -36px 36px;
            border-radius: 24px 24px 0 0;
        }

        /* ── Logo ── */
        .logo-wrap {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px; height: 52px;
            background: linear-gradient(135deg, rgba(26,188,156,0.25), rgba(6,182,212,0.15));
            border: 1px solid rgba(26,188,156,0.35);
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 0 20px rgba(26,188,156,0.2);
        }
        .logo-icon i { font-size: 22px; color: #1abc9c; }
        .logo-name {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #1abc9c 0%, #06b6d4 60%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-sub {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.38);
            letter-spacing: 1.5px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* ── Divider ── */
        .glass-divider {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            margin: 0 0 28px;
        }

        /* ── Alert ── */
        .alert-glass {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fca5a5;
            font-size: 0.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Field ── */
        .field-group { margin-bottom: 18px; }
        .field-label {
            display: block;
            font-size: 0.67rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .input-glass {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
            overflow: hidden;
        }
        .input-glass:focus-within {
            border-color: rgba(26,188,156,0.6);
            background: rgba(26,188,156,0.05);
            box-shadow: 0 0 0 3px rgba(26,188,156,0.12);
        }
        .input-icon {
            width: 44px;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            flex-shrink: 0;
            transition: color 0.25s;
        }
        .input-glass:focus-within .input-icon {
            color: rgba(26,188,156,0.8);
        }
        .input-glass input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: rgba(255,255,255,0.9);
            font-family: 'Sora', sans-serif;
            font-size: 0.88rem;
            padding: 13px 14px 13px 0;
        }
        .input-glass input::placeholder {
            color: rgba(255,255,255,0.22);
        }

        /* password toggle */
        .pwd-toggle {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            padding: 0 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .pwd-toggle:hover { color: rgba(255,255,255,0.6); }

        /* ── Button ── */
        .btn-glass {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1abc9c 0%, #0ea881 100%);
            color: #fff;
            font-family: 'Sora', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(26,188,156,0.4), 0 1px 0 rgba(255,255,255,0.15) inset;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-glass::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            border-radius: inherit;
        }
        .btn-glass:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(26,188,156,0.5), 0 1px 0 rgba(255,255,255,0.15) inset;
        }
        .btn-glass:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 2px 12px rgba(26,188,156,0.35);
        }

        /* ── Footer ── */
        .glass-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.68rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
        }

        /* ── Corner dots decoration ── */
        .corner-dot {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(26,188,156,0.5);
        }
        .corner-dot.tl { top: 14px; left: 14px; }
        .corner-dot.tr { top: 14px; right: 14px; }
        .corner-dot.bl { bottom: 14px; left: 14px; }
        .corner-dot.br { bottom: 14px; right: 14px; }
    </style>
</head>
<body>

<!-- Background -->
<div class="bg-scene">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
</div>
<div class="bg-grid"></div>

<!-- Card -->
<div class="login-wrapper">
    <div class="glass-card" style="position:relative;">
        <span class="corner-dot tl"></span>
        <span class="corner-dot tr"></span>
        <span class="corner-dot bl"></span>
        <span class="corner-dot br"></span>

        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-icon">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div class="logo-name">AIKONIK</div>
            <div class="logo-sub">Booking Management System</div>
        </div>

        <hr class="glass-divider">

        <!-- Error -->
        {% if error %}
        <div class="alert-glass">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ error }}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="post">
            <div class="field-group">
                <label class="field-label">Username</label>
                <div class="input-glass">
                    <span class="input-icon"><i class="fa fa-user"></i></span>
                    <input type="text" name="username" placeholder="Enter your username" required autofocus>
                </div>
            </div>

            <div class="field-group" style="margin-bottom:24px">
                <label class="field-label">Password</label>
                <div class="input-glass">
                    <span class="input-icon"><i class="fa fa-lock"></i></span>
                    <input type="password" name="password" id="pwd" placeholder="Enter your password" required>
                    <button type="button" class="pwd-toggle" onclick="togglePwd()" id="eyeBtn" aria-label="Toggle password visibility">
                        <i class="fa fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-glass">
                <i class="fa fa-sign-in-alt" style="margin-right:8px"></i> Sign In
            </button>
        </form>

        <div class="glass-footer">© 2026 AIKONIK &nbsp;·&nbsp; All rights reserved</div>
    </div>
</div>

<script>
function togglePwd() {
    var input = document.getElementById('pwd');
    var icon  = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fa fa-eye';
    }
}
</script>

</body>
</html>
